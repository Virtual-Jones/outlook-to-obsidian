<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Outlook to Obsidian</title>

  <!-- Office.js must be loaded before any other scripts -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>

  <!-- Turndown: HTML → Markdown for email body conversion -->
  <script src="https://cdn.jsdelivr.net/npm/turndown@7.2.0/dist/turndown.min.js"></script>
  <!-- Turndown GFM plugin: adds tables, strikethrough, task lists -->
  <script src="https://cdn.jsdelivr.net/npm/@joplin/turndown-plugin-gfm@1.0.61/dist/turndown-plugin-gfm.js"></script>

  <style>
    /* ── Reset / base ───────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 14px;
      color: #323130;
      background: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px 10px;
      border-bottom: 1px solid #edebe9;
      flex-shrink: 0;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 600;
      color: #0078d4;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #605e5c;
      transition: background 0.15s;
    }
    .icon-btn:hover { background: #f3f2f1; }

    /* ── Scroll area ─────────────────────────────────────────────────── */
    .scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ── Config info box ─────────────────────────────────────────────── */
    .config-box {
      background: #f3f2f1;
      border-radius: 4px;
      padding: 10px 12px;
      font-size: 12px;
    }

    .config-row {
      display: flex;
      gap: 6px;
      line-height: 1.6;
    }

    .config-label { font-weight: 600; min-width: 48px; color: #605e5c; }
    .config-value { color: #323130; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }

    .config-warning {
      background: #fff4ce;
      border: 1px solid #ffc83d;
      border-radius: 4px;
      padding: 10px 12px;
      font-size: 12px;
      color: #323130;
    }

    /* ── Buttons ─────────────────────────────────────────────────────── */
    .btn {
      width: 100%;
      padding: 10px 16px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, opacity 0.15s;
    }

    .btn-primary { background: #0078d4; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #106ebe; }

    .btn-secondary {
      background: #f3f2f1;
      color: #323130;
      border: 1px solid #d2d0ce;
    }
    .btn-secondary:hover:not(:disabled) { background: #e1dfdd; }

    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Action row (side-by-side buttons) */
    .action-row {
      display: flex;
      gap: 8px;
    }
    .action-row .btn { flex: 1; }

    /* Hidden anchor used to trigger obsidian:// protocol handler */
    #obsidianLink { display: none; }

    /* ── Status ──────────────────────────────────────────────────────── */
    .status {
      padding: 10px 12px;
      border-radius: 4px;
      font-size: 13px;
      display: none;
    }
    .status.info    { background: #e6f3ff; color: #0078d4; border: 1px solid #c7e0f4; display: block; }
    .status.success { background: #dff6dd; color: #107c10; border: 1px solid #b3d9b2; display: block; }
    .status.error   { background: #fde7e9; color: #a4262c; border: 1px solid #f1c2c4; display: block; }

    /* ── Details box ─────────────────────────────────────────────────── */
    .details-box {
      background: #f3f2f1;
      border-radius: 4px;
      padding: 10px 12px;
      display: none;
      font-size: 12px;
      line-height: 1.6;
    }

    .detail-row { display: flex; gap: 8px; margin-bottom: 2px; }
    .detail-label { font-weight: 600; min-width: 72px; color: #605e5c; }
    .detail-value { flex: 1; color: #323130; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .detail-value.external { color: #a4262c; font-weight: 600; }

    /* ── Settings panel ──────────────────────────────────────────────── */
    #settingsPanel { display: none; flex-direction: column; gap: 0; }

    .settings-back {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 12px 16px 10px;
      border-bottom: 1px solid #edebe9;
      flex-shrink: 0;
    }

    .settings-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group { display: flex; flex-direction: column; gap: 4px; }

    label {
      font-size: 12px;
      font-weight: 600;
      color: #323130;
    }

    input[type="text"] {
      padding: 8px 10px;
      border: 1px solid #d2d0ce;
      border-radius: 4px;
      font-size: 13px;
      font-family: inherit;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #0078d4;
      box-shadow: 0 0 0 1px #0078d4;
    }

    .help-text { font-size: 11px; color: #605e5c; line-height: 1.4; }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .checkbox-group input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
    .checkbox-group label { font-size: 13px; font-weight: 400; cursor: pointer; }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #605e5c;
      padding-bottom: 4px;
      border-bottom: 1px solid #edebe9;
    }

    .preview-box {
      background: #f3f2f1;
      border-radius: 4px;
      padding: 8px 10px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 11px;
      color: #323130;
      white-space: pre;
      line-height: 1.5;
    }

    .preset-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .preset-btn {
      padding: 4px 10px;
      border: 1px solid #d2d0ce;
      border-radius: 12px;
      background: #fff;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .preset-btn:hover { background: #f3f2f1; }

    .settings-footer {
      padding: 12px 16px;
      border-top: 1px solid #edebe9;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════════
     MAIN PANEL
═══════════════════════════════════════════════════════════════════ -->
<div id="mainPanel" style="display:flex; flex-direction:column; height:100%;">

  <div class="header">
    <div class="header-title">
      <span id="headerIcon">📅</span>
      <span id="headerTitle">Send to Obsidian</span>
    </div>
    <button class="icon-btn" id="settingsBtn" title="Settings">⚙️</button>
  </div>

  <div class="scroll-area">
    <div id="configWarning" class="config-warning" style="display:none;">
      ⚠️ Please configure your vault settings before extracting.
    </div>

    <div class="config-box" id="configBox">
      <div class="config-row">
        <span class="config-label">Vault</span>
        <span class="config-value" id="vaultDisplay">Loading…</span>
      </div>
      <div class="config-row">
        <span class="config-label">Path</span>
        <span class="config-value" id="pathDisplay">Loading…</span>
      </div>
    </div>

    <button class="btn btn-primary" id="extractBtn">
      <span>📧</span>
      <span>Extract Meeting Details</span>
    </button>

    <div class="status" id="status"></div>

    <div class="details-box" id="details"></div>

    <div class="action-row" id="actions" style="display:none;">
      <button class="btn btn-primary" id="openObsidianBtn">
        <span>📝</span>
        <span>Open in Obsidian</span>
      </button>
      <button class="btn btn-secondary" id="copyBtn" title="Copy note to clipboard">
        📋
      </button>
    </div>

    <!-- Hidden anchor: most reliable way to trigger obsidian:// URI across platforms -->
    <a id="obsidianLink" href="#" target="_blank" rel="noopener noreferrer"></a>
  </div>

</div>

<!-- ═══════════════════════════════════════════════════════════════════
     SETTINGS PANEL
═══════════════════════════════════════════════════════════════════ -->
<div id="settingsPanel" style="height:100%; display:none; flex-direction:column;">

  <div class="settings-back">
    <button class="icon-btn" id="backBtn" title="Back">←</button>
    <span style="font-weight:600; font-size:14px;">Settings</span>
  </div>

  <div class="settings-body">

    <div class="section-title">Obsidian</div>

    <div class="form-group">
      <label for="vaultName">Vault Name</label>
      <input type="text" id="vaultName" placeholder="e.g. Syntax"/>
      <div class="preset-row">
        <button class="preset-btn" data-target="vaultName" data-value="Syntax">Syntax</button>
        <button class="preset-btn" data-target="vaultName" data-value="Work">Work</button>
        <button class="preset-btn" data-target="vaultName" data-value="Personal">Personal</button>
      </div>
    </div>

    <div class="form-group">
      <label for="folderPath">Meeting Notes Folder</label>
      <input type="text" id="folderPath" placeholder="e.g. 02. Meeting Notes"/>
      <div class="help-text">Year/month subfolders are created automatically.</div>
      <div class="preset-row">
        <button class="preset-btn" data-target="folderPath" data-value="Meeting Notes">Meeting Notes</button>
        <button class="preset-btn" data-target="folderPath" data-value="02. Meeting Notes">02. Meeting Notes</button>
        <button class="preset-btn" data-target="folderPath" data-value="Work/Meetings">Work/Meetings</button>
      </div>
    </div>

    <div class="form-group">
      <label for="emailFolderPath">Email Notes Folder</label>
      <input type="text" id="emailFolderPath" placeholder="e.g. 04. Email Notes"/>
      <div class="help-text">Used when extracting an email message.</div>
      <div class="preset-row">
        <button class="preset-btn" data-target="emailFolderPath" data-value="Email Notes">Email Notes</button>
        <button class="preset-btn" data-target="emailFolderPath" data-value="04. Email Notes">04. Email Notes</button>
        <button class="preset-btn" data-target="emailFolderPath" data-value="Work/Emails">Work/Emails</button>
      </div>
    </div>

    <div class="form-group">
      <label for="folderPreviewLabel">Folder Preview</label>
      <div class="preview-box" id="folderPreview"></div>
    </div>

    <div class="section-title">Organisation</div>

    <div class="form-group">
      <label for="internalDomain">Internal Email Domain</label>
      <input type="text" id="internalDomain" placeholder="e.g. syntax.com"/>
      <div class="help-text">Attendees with other domains are flagged as external.</div>
    </div>

    <div class="section-title">Options</div>

    <div class="checkbox-group">
      <input type="checkbox" id="copyToClipboard"/>
      <label for="copyToClipboard">Copy note to clipboard after extracting</label>
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="includeExternal"/>
      <label for="includeExternal">Prefix external meeting titles with [EXTERNAL]</label>
    </div>

  </div>

  <div class="settings-footer">
    <button class="btn btn-primary" id="saveSettingsBtn">Save Settings</button>
  </div>

</div>

<script src="taskpane.js"></script>
</body>
</html>
